<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="60" y="50" fill="#f8fafc" font-size="24" font-weight="700">SupportMaster: Modular Multi-Agent Pipeline &amp; Deterministic Safety Gates</text>
  <text x="60" y="75" fill="#94a3b8" font-size="14">All Things Agentic Hackathon · Taskmaster Track · 21 Specialized Agents on Google ADK</text>

  <!-- Legend -->
  <rect x="750" y="35" width="18" height="18" rx="4" fill="#dc2626"/>
  <text x="775" y="49" fill="#f1f5f9" font-size="12" font-weight="600">Core Skeleton Gate (Immutable)</text>

  <rect x="980" y="35" width="18" height="18" rx="4" fill="#16a34a"/>
  <text x="1005" y="49" fill="#f1f5f9" font-size="12" font-weight="600">Pluggable Capability Node</text>

  <!-- Section: Pluggable Adapters Layer -->
  <rect x="60" y="110" width="1080" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-dasharray="4 4"/>
  <text x="80" y="135" fill="#38bdf8" font-size="13" font-weight="700">PLUGGABLE VENDOR ADAPTERS (AdapterRegistry)</text>
  
  <rect x="80" y="145" width="220" height="35" rx="6" fill="#0369a1" filter="url(#shadow)"/>
  <text x="190" y="167" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Jira · Linear · Zendesk</text>

  <rect x="340" y="145" width="240" height="35" rx="6" fill="#0369a1" filter="url(#shadow)"/>
  <text x="460" y="167" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">GitHub · GitLab · Bitbucket</text>

  <rect x="620" y="145" width="240" height="35" rx="6" fill="#0369a1" filter="url(#shadow)"/>
  <text x="740" y="167" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">GitHub Actions · GitLab CI</text>

  <rect x="900" y="145" width="220" height="35" rx="6" fill="#0369a1" filter="url(#shadow)"/>
  <text x="1010" y="167" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Slack · Datadog</text>

  <!-- Row 1: Intake -> Gemma -> Duplicate Gate -> Safety Stop / Evidence -->
  <!-- Ticket Intake -->
  <rect x="60" y="230" width="180" height="60" rx="8" fill="#16a34a" filter="url(#shadow)"/>
  <text x="150" y="255" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Ticket Intake</text>
  <text x="150" y="275" fill="#dcfce7" font-size="11" text-anchor="middle">Canonical SupportCase</text>

  <!-- Gemma Advisory -->
  <rect x="270" y="230" width="180" height="60" rx="8" fill="#16a34a" filter="url(#shadow)"/>
  <text x="360" y="255" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Gemma 3 Triage</text>
  <text x="360" y="275" fill="#dcfce7" font-size="11" text-anchor="middle">gemma-3-27b-it (Advisory)</text>

  <!-- Duplicate Gate -->
  <polygon points="560,230 630,260 560,290 490,260" fill="#dc2626" filter="url(#shadow)"/>
  <text x="560" y="257" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Duplicate</text>
  <text x="560" y="270" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Check Gate</text>

  <!-- Stop Duplicate -->
  <rect x="490" y="320" width="140" height="40" rx="6" fill="#991b1b"/>
  <text x="560" y="345" fill="#fee2e2" font-size="11" font-weight="600" text-anchor="middle">Safety Stop (Duplicate)</text>

  <!-- Evidence Gathering -->
  <rect x="680" y="230" width="190" height="60" rx="8" fill="#16a34a" filter="url(#shadow)"/>
  <text x="775" y="255" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Evidence Gathering</text>
  <text x="775" y="275" fill="#dcfce7" font-size="11" text-anchor="middle">Google Search Grounding</text>

  <!-- Parallel Investigation Fan-Out -->
  <rect x="910" y="210" width="230" height="100" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="1025" y="230" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">PARALLEL FAN-OUT</text>
  
  <rect x="925" y="240" width="200" height="28" rx="4" fill="#16a34a"/>
  <text x="1025" y="258" fill="#fff" font-size="11" text-anchor="middle">Investigation (FTS5 Memory)</text>

  <rect x="925" y="273" width="200" height="28" rx="4" fill="#16a34a"/>
  <text x="1025" y="291" fill="#fff" font-size="11" text-anchor="middle">Repository Discovery (VCS)</text>

  <!-- Row 2: Join Gate -> Root Cause -> Remediation Plan -> Implementation Gate -->
  <!-- Join Gate -->
  <polygon points="1025,350 1085,380 1025,410 965,380" fill="#dc2626" filter="url(#shadow)"/>
  <text x="1025" y="377" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Deterministic</text>
  <text x="1025" y="390" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Join Gate</text>

  <!-- Root Cause Agent -->
  <rect x="730" y="350" width="180" height="60" rx="8" fill="#16a34a" filter="url(#shadow)"/>
  <text x="820" y="375" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Root Cause Analysis</text>
  <text x="820" y="395" fill="#dcfce7" font-size="11" text-anchor="middle">Confidence &amp; Evidence Links</text>

  <!-- Remediation Plan Agent -->
  <rect x="500" y="390" width="180" height="60" rx="8" fill="#16a34a" filter="url(#shadow)"/>
  <text x="590" y="415" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Remediation Plan</text>
  <text x="590" y="435" fill="#dcfce7" font-size="11" text-anchor="middle">Scoped Diff &amp; Target Paths</text>

  <!-- Implementation Gate -->
  <polygon points="340,390 410,420 340,450 270,420" fill="#dc2626" filter="url(#shadow)"/>
  <text x="340" y="417" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Implementation</text>
  <text x="340" y="430" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Gate</text>

  <!-- Stop Implementation -->
  <rect x="270" y="480" width="140" height="40" rx="6" fill="#991b1b"/>
  <text x="340" y="505" fill="#fee2e2" font-size="11" font-weight="600" text-anchor="middle">Safety Stop (Denied)</text>

  <!-- Row 3: Code Change -> Validation & Test -> Self-Healing Loop -> Publication Gate -->
  <!-- Code Change Agent -->
  <rect x="60" y="560" width="190" height="60" rx="8" fill="#16a34a" filter="url(#shadow)"/>
  <text x="155" y="585" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Code Change Agent</text>
  <text x="155" y="605" fill="#dcfce7" font-size="11" text-anchor="middle">Self-Healing Retries (x3)</text>

  <!-- Validation & Test Agent -->
  <rect x="290" y="560" width="180" height="60" rx="8" fill="#16a34a" filter="url(#shadow)"/>
  <text x="380" y="585" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">CI Validation &amp; Test</text>
  <text x="380" y="605" fill="#dcfce7" font-size="11" text-anchor="middle">Real Subprocess Runner</text>

  <!-- Validation Gate -->
  <polygon points="540,560 600,590 540,620 480,590" fill="#dc2626" filter="url(#shadow)"/>
  <text x="540" y="587" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Validation</text>
  <text x="540" y="600" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Gate</text>

  <!-- Failure Diagnosis (Self-Healing Loop) -->
  <rect x="220" y="660" width="220" height="50" rx="8" fill="#d97706" stroke="#b45309"/>
  <text x="330" y="683" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Failure Diagnosis Node</text>
  <text x="330" y="700" fill="#fef3c7" font-size="10" text-anchor="middle">Escalating Directives (Rollback on 3x Fail)</text>

  <!-- Publication Gate -->
  <polygon points="720,560 780,590 720,620 660,590" fill="#dc2626" filter="url(#shadow)"/>
  <text x="720" y="587" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Publication</text>
  <text x="720" y="600" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Gate</text>

  <!-- HITL Review Queue & Co-Pilot Chat -->
  <rect x="630" y="660" width="180" height="60" rx="8" fill="#7c3aed" filter="url(#shadow)"/>
  <text x="720" y="685" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">HITL Review Queue</text>
  <text x="720" y="705" fill="#ede9fe" font-size="10" text-anchor="middle">Co-Pilot Safety Chat (GenAI)</text>

  <!-- Publish Executor -->
  <rect x="850" y="560" width="160" height="60" rx="8" fill="#16a34a" filter="url(#shadow)"/>
  <text x="930" y="585" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Publish Executor</text>
  <text x="930" y="605" fill="#dcfce7" font-size="11" text-anchor="middle">Git / GitHub PR &amp; Receipts</text>

  <!-- Final Audit Gate -->
  <rect x="1050" y="560" width="110" height="60" rx="8" fill="#dc2626" filter="url(#shadow)"/>
  <text x="1105" y="585" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Final Audit</text>
  <text x="1105" y="605" fill="#fee2e2" font-size="11" text-anchor="middle">Verified Run</text>

  <!-- Connecting Lines and Arrows -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M 240,260 L 270,260"/>
    <path d="M 450,260 L 490,260"/>
    <path d="M 560,290 L 560,320"/>
    <path d="M 630,260 L 680,260"/>
    <path d="M 870,260 L 910,260"/>
    <path d="M 1025,310 L 1025,350"/>
    <path d="M 965,380 L 910,380"/>
    <path d="M 730,380 L 680,420"/>
    <path d="M 500,420 L 410,420"/>
    <path d="M 340,450 L 340,480"/>
    <path d="M 270,420 C 150,420 155,480 155,560"/>
    <path d="M 250,590 L 290,590"/>
    <path d="M 470,590 L 480,590"/>
    <path d="M 540,620 C 540,685 450,685 440,685"/>
    <path d="M 220,685 C 100,685 100,630 100,620"/>
    <path d="M 600,590 L 660,590"/>
    <path d="M 720,620 L 720,660"/>
    <path d="M 780,590 L 850,590"/>
    <path d="M 810,690 C 880,690 880,630 880,620"/>
    <path d="M 1010,590 L 1050,590"/>
  </g>
</svg>
